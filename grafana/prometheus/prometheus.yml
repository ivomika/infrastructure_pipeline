global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: host
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: jenkins
    metrics_path: /prometheus
    static_configs:
      - targets: ["jenkins-controller:8080"]
