services:
  nodejs-agent-image:
    image: ${NODEJS_AGENT_IMAGE:?NODEJS_AGENT_IMAGE is required}
    pull_policy: never
    profiles:
      - agent-image
    build:
      context: ./nodejs
      dockerfile: dockerfile
      args:
        JENKINS_INBOUND_AGENT_IMAGE: ${JENKINS_INBOUND_AGENT_TAG:?JENKINS_INBOUND_AGENT_TAG is required}@${JENKINS_INBOUND_AGENT_DIGEST:?JENKINS_INBOUND_AGENT_DIGEST is required}
        DEBIAN_SNAPSHOT: ${DEBIAN_AGENT_SNAPSHOT:?DEBIAN_AGENT_SNAPSHOT is required}
        CA_CERTIFICATES_VERSION: ${DEBIAN_CA_CERTIFICATES_VERSION:?DEBIAN_CA_CERTIFICATES_VERSION is required}
        CURL_VERSION: ${DEBIAN_CURL_VERSION:?DEBIAN_CURL_VERSION is required}
        GIT_VERSION: ${DEBIAN_GIT_VERSION:?DEBIAN_GIT_VERSION is required}
        XZ_UTILS_VERSION: ${DEBIAN_XZ_UTILS_VERSION:?DEBIAN_XZ_UTILS_VERSION is required}
        NODE_VERSION: ${NODE_VERSION:?NODE_VERSION is required}
        NODE_LINUX_X64_URL: ${NODE_LINUX_X64_URL:?NODE_LINUX_X64_URL is required}
        NODE_LINUX_X64_SHA256: ${NODE_LINUX_X64_SHA256:?NODE_LINUX_X64_SHA256 is required}
        NODE_LINUX_ARM64_URL: ${NODE_LINUX_ARM64_URL:?NODE_LINUX_ARM64_URL is required}
        NODE_LINUX_ARM64_SHA256: ${NODE_LINUX_ARM64_SHA256:?NODE_LINUX_ARM64_SHA256 is required}
    entrypoint:
      - /bin/true

  java-agent-image:
    image: ${JAVA_AGENT_IMAGE:?JAVA_AGENT_IMAGE is required}
    pull_policy: never
    profiles:
      - agent-image
    build:
      context: ./java
      dockerfile: dockerfile
      args:
        JENKINS_INBOUND_AGENT_IMAGE: ${JENKINS_INBOUND_AGENT_TAG:?JENKINS_INBOUND_AGENT_TAG is required}@${JENKINS_INBOUND_AGENT_DIGEST:?JENKINS_INBOUND_AGENT_DIGEST is required}
        DEBIAN_SNAPSHOT: ${DEBIAN_AGENT_SNAPSHOT:?DEBIAN_AGENT_SNAPSHOT is required}
        CA_CERTIFICATES_VERSION: ${DEBIAN_CA_CERTIFICATES_VERSION:?DEBIAN_CA_CERTIFICATES_VERSION is required}
        CURL_VERSION: ${DEBIAN_CURL_VERSION:?DEBIAN_CURL_VERSION is required}
        GIT_VERSION: ${DEBIAN_GIT_VERSION:?DEBIAN_GIT_VERSION is required}
        UNZIP_VERSION: ${DEBIAN_UNZIP_VERSION:?DEBIAN_UNZIP_VERSION is required}
        ZIP_VERSION: ${DEBIAN_ZIP_VERSION:?DEBIAN_ZIP_VERSION is required}
        MAVEN_VERSION: ${MAVEN_VERSION:?MAVEN_VERSION is required}
        MAVEN_URL: ${MAVEN_URL:?MAVEN_URL is required}
        MAVEN_ARCHIVE_SHA512: ${MAVEN_ARCHIVE_SHA512:?MAVEN_ARCHIVE_SHA512 is required}
    entrypoint:
      - /bin/true

  flutter-agent-image:
    image: ${FLUTTER_AGENT_IMAGE:?FLUTTER_AGENT_IMAGE is required}
    pull_policy: never
    profiles:
      - agent-image
    build:
      context: ./flutter
      dockerfile: dockerfile
      args:
        JENKINS_INBOUND_AGENT_IMAGE: ${JENKINS_INBOUND_AGENT_TAG:?JENKINS_INBOUND_AGENT_TAG is required}@${JENKINS_INBOUND_AGENT_DIGEST:?JENKINS_INBOUND_AGENT_DIGEST is required}
        DEBIAN_SNAPSHOT: ${DEBIAN_AGENT_SNAPSHOT:?DEBIAN_AGENT_SNAPSHOT is required}
        CA_CERTIFICATES_VERSION: ${DEBIAN_CA_CERTIFICATES_VERSION:?DEBIAN_CA_CERTIFICATES_VERSION is required}
        CURL_VERSION: ${DEBIAN_CURL_VERSION:?DEBIAN_CURL_VERSION is required}
        GIT_VERSION: ${DEBIAN_GIT_VERSION:?DEBIAN_GIT_VERSION is required}
        LIBGLU1_MESA_VERSION: ${DEBIAN_LIBGLU1_MESA_VERSION:?DEBIAN_LIBGLU1_MESA_VERSION is required}
        LIBSQLITE3_DEV_VERSION: ${DEBIAN_LIBSQLITE3_DEV_VERSION:?DEBIAN_LIBSQLITE3_DEV_VERSION is required}
        UNZIP_VERSION: ${DEBIAN_UNZIP_VERSION:?DEBIAN_UNZIP_VERSION is required}
        XZ_UTILS_VERSION: ${DEBIAN_XZ_UTILS_VERSION:?DEBIAN_XZ_UTILS_VERSION is required}
        ZIP_VERSION: ${DEBIAN_ZIP_VERSION:?DEBIAN_ZIP_VERSION is required}
        FLUTTER_VERSION: ${FLUTTER_VERSION:?FLUTTER_VERSION is required}
        FLUTTER_URL: ${FLUTTER_URL:?FLUTTER_URL is required}
        FLUTTER_ARCHIVE_SHA256: ${FLUTTER_ARCHIVE_SHA256:?FLUTTER_ARCHIVE_SHA256 is required}
        ANDROID_COMMAND_LINE_TOOLS_VERSION: ${ANDROID_COMMAND_LINE_TOOLS_VERSION:?ANDROID_COMMAND_LINE_TOOLS_VERSION is required}
        ANDROID_COMMAND_LINE_TOOLS_URL: ${ANDROID_COMMAND_LINE_TOOLS_URL:?ANDROID_COMMAND_LINE_TOOLS_URL is required}
        ANDROID_COMMAND_LINE_TOOLS_SHA256: ${ANDROID_COMMAND_LINE_TOOLS_SHA256:?ANDROID_COMMAND_LINE_TOOLS_SHA256 is required}
        ANDROID_COMMAND_LINE_TOOLS_SHA1: ${ANDROID_COMMAND_LINE_TOOLS_SHA1:?ANDROID_COMMAND_LINE_TOOLS_SHA1 is required}
        ANDROID_PLATFORM_VERSION: ${ANDROID_PLATFORM_VERSION:?ANDROID_PLATFORM_VERSION is required}
        ANDROID_BUILD_TOOLS_VERSION: ${ANDROID_BUILD_TOOLS_VERSION:?ANDROID_BUILD_TOOLS_VERSION is required}
    entrypoint:
      - /bin/true
