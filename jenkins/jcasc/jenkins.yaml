jenkins:
  systemMessage: "Minimal Jenkins in Docker managed by JCasC"
  numExecutors: 0
  mode: NORMAL
  slaveAgentPort: 50000
  clouds:
    - docker:
        name: "${JENKINS_DOCKER_CLOUD_NAME}"
        containerCap: ${JENKINS_DOCKER_CONTAINER_CAP}
        dockerApi:
          dockerHost:
            uri: "${JENKINS_DOCKER_HOST}"
          connectTimeout: 60
          readTimeout: 60
        templates:
          - &docker-agent-template
            name: "${NODEJS_AGENT_NAME}"
            labelString: "${NODEJS_AGENT_LABELS}"
            remoteFs: "${JENKINS_AGENT_REMOTE_FS}"
            mode: EXCLUSIVE
            instanceCapStr: "${NODEJS_AGENT_INSTANCE_CAP}"
            pullStrategy: PULL_NEVER
            pullTimeout: 600
            removeVolumes: true
            retentionStrategy:
              idleMinutes: 0
            connector:
              jnlp:
                jenkinsUrl: "${JENKINS_INTERNAL_URL}"
                user: "jenkins"
            dockerTemplateBase:
              <<: &docker-agent-container
                network: "${JENKINS_DOCKER_NETWORK}"
                memoryLimit: ${JENKINS_AGENT_MEMORY_MB}
                cpus: "${JENKINS_AGENT_CPUS}"
              image: "${NODEJS_AGENT_IMAGE}"
          - <<: *docker-agent-template
            name: "${JAVA_AGENT_NAME}"
            labelString: "${JAVA_AGENT_LABELS}"
            instanceCapStr: "${JAVA_AGENT_INSTANCE_CAP}"
            dockerTemplateBase:
              <<: *docker-agent-container
              image: "${JAVA_AGENT_IMAGE}"
          - <<: *docker-agent-template
            name: "${FLUTTER_AGENT_NAME}"
            labelString: "${FLUTTER_AGENT_LABELS}"
            instanceCapStr: "${FLUTTER_AGENT_INSTANCE_CAP}"
            dockerTemplateBase:
              <<: *docker-agent-container
              image: "${FLUTTER_AGENT_IMAGE}"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${readFile:${JENKINS_ADMIN_PASSWORD_FILE}}"
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_ID}"
            permissions:
              - "Overall/Administer"

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "${SHARED_LIBRARY_CREDENTIALS_ID}"
              username: "${SHARED_LIBRARY_SSH_USERNAME}"
              description: "SSH deploy key for Jenkins shared library"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:${SHARED_LIBRARY_SSH_PRIVATE_KEY_PATH}}"

unclassified:
  location:
    url: "${JENKINS_URL}"
  globalLibraries:
    libraries:
      - name: "${SHARED_LIBRARY_NAME}"
        defaultVersion: "${SHARED_LIBRARY_DEFAULT_BRANCH}"
        implicit: false
        allowVersionOverride: true
        includeInChangesets: false
        retriever:
          modernSCM:
            scm:
              gitSource:
                remote: "${SHARED_LIBRARY_REPOSITORY_URL}"
                credentialsId: "${SHARED_LIBRARY_CREDENTIALS_ID}"

security:
  gitHostKeyVerificationConfiguration:
    sshHostKeyVerificationStrategy: "knownHostsFileVerificationStrategy"
