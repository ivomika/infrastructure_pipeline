services:
  docker-socket-proxy:
    image: ${DOCKER_SOCKET_PROXY_TAG:?DOCKER_SOCKET_PROXY_TAG is required}@${DOCKER_SOCKET_PROXY_DIGEST:?DOCKER_SOCKET_PROXY_DIGEST is required}
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      INFO: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-socket-proxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - docker-api

  jenkins:
    image: ${JENKINS_CONTROLLER_IMAGE:?JENKINS_CONTROLLER_IMAGE is required}
    pull_policy: never
    build:
      context: .
      dockerfile: dockerfile
      args:
        JENKINS_CONTROLLER_BASE_IMAGE: ${JENKINS_CONTROLLER_BASE_TAG:?JENKINS_CONTROLLER_BASE_TAG is required}@${JENKINS_CONTROLLER_BASE_DIGEST:?JENKINS_CONTROLLER_BASE_DIGEST is required}
        DEBIAN_SNAPSHOT: ${DEBIAN_CONTROLLER_SNAPSHOT:?DEBIAN_CONTROLLER_SNAPSHOT is required}
        GIT_VERSION: ${DEBIAN_GIT_VERSION:?DEBIAN_GIT_VERSION is required}
        OPENSSH_CLIENT_VERSION: ${DEBIAN_OPENSSH_CLIENT_VERSION:?DEBIAN_OPENSSH_CLIENT_VERSION is required}
    container_name: jenkins
    restart: unless-stopped
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc/jenkins.yaml
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8080/}
      JENKINS_INTERNAL_URL: ${JENKINS_INTERNAL_URL:-http://jenkins:8080/}
      JENKINS_DOCKER_CLOUD_NAME: ${JENKINS_DOCKER_CLOUD_NAME:-local-docker}
      JENKINS_DOCKER_CONTAINER_CAP: ${JENKINS_DOCKER_CONTAINER_CAP:-4}
      JENKINS_DOCKER_HOST: ${JENKINS_DOCKER_HOST:-tcp://docker-socket-proxy:2375}
      JENKINS_DOCKER_NETWORK: ${JENKINS_DOCKER_NETWORK:-jenkins}
      SHARED_LIBRARY_NAME: ${SHARED_LIBRARY_NAME:?SHARED_LIBRARY_NAME is required}
      SHARED_LIBRARY_REPOSITORY_URL: ${SHARED_LIBRARY_REPOSITORY_URL:?SHARED_LIBRARY_REPOSITORY_URL is required}
      SHARED_LIBRARY_DEFAULT_BRANCH: ${SHARED_LIBRARY_DEFAULT_BRANCH:?SHARED_LIBRARY_DEFAULT_BRANCH is required}
      SHARED_LIBRARY_CREDENTIALS_ID: ${SHARED_LIBRARY_CREDENTIALS_ID:?SHARED_LIBRARY_CREDENTIALS_ID is required}
      SHARED_LIBRARY_SSH_USERNAME: ${SHARED_LIBRARY_SSH_USERNAME:-git}
      SHARED_LIBRARY_SSH_PRIVATE_KEY_PATH: ${SHARED_LIBRARY_SSH_PRIVATE_KEY_PATH:-/var/jenkins_home/.ssh/shared-library.key}
      FLUTTER_AGENT_NAME: ${FLUTTER_AGENT_NAME:-flutter-agent}
      FLUTTER_AGENT_LABELS: ${FLUTTER_AGENT_LABELS:-flutter}
      FLUTTER_AGENT_REMOTE_FS: ${FLUTTER_AGENT_REMOTE_FS:-/home/jenkins/agent}
      FLUTTER_AGENT_INSTANCE_CAP: ${FLUTTER_AGENT_INSTANCE_CAP:-2}
      FLUTTER_AGENT_IMAGE: ${FLUTTER_AGENT_IMAGE:?FLUTTER_AGENT_IMAGE is required}
      NODEJS_AGENT_NAME: ${NODEJS_AGENT_NAME:-nodejs-agent}
      NODEJS_AGENT_LABELS: ${NODEJS_AGENT_LABELS:-nodejs}
      NODEJS_AGENT_REMOTE_FS: ${NODEJS_AGENT_REMOTE_FS:-/home/jenkins/agent}
      NODEJS_AGENT_INSTANCE_CAP: ${NODEJS_AGENT_INSTANCE_CAP:-2}
      NODEJS_AGENT_IMAGE: ${NODEJS_AGENT_IMAGE:?NODEJS_AGENT_IMAGE is required}
      JAVA_AGENT_NAME: ${JAVA_AGENT_NAME:-java-agent}
      JAVA_AGENT_LABELS: ${JAVA_AGENT_LABELS:-java maven backend}
      JAVA_AGENT_REMOTE_FS: ${JAVA_AGENT_REMOTE_FS:-/home/jenkins/agent}
      JAVA_AGENT_INSTANCE_CAP: ${JAVA_AGENT_INSTANCE_CAP:-2}
      JAVA_AGENT_IMAGE: ${JAVA_AGENT_IMAGE:?JAVA_AGENT_IMAGE is required}
    ports:
      - "8080:8080"
    expose:
      - "50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jcasc:/var/jenkins_home/casc:ro
      - ./secrets:/var/jenkins_home/.ssh:ro
    networks:
      - jenkins
      - docker-api

volumes:
  jenkins_home:

networks:
  jenkins:
    name: ${JENKINS_DOCKER_NETWORK:-jenkins}
  docker-api:
    internal: true
