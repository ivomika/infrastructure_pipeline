x-plane-db-env: &plane-db-env
  PGHOST: plane-db
  PGDATABASE: plane
  POSTGRES_USER: plane
  POSTGRES_PASSWORD: ${PLANE_DB_PASSWORD:-change-me-plane-db}
  POSTGRES_DB: plane
  PGDATA: /var/lib/postgresql/data

x-plane-redis-env: &plane-redis-env
  REDIS_HOST: plane-redis
  REDIS_PORT: 6379
  REDIS_URL: redis://plane-redis:6379/

x-plane-mq-env: &plane-mq-env
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: 5672
  RABBITMQ_DEFAULT_USER: plane
  RABBITMQ_DEFAULT_PASS: ${PLANE_RABBITMQ_PASSWORD:-change-me-plane-rabbitmq}
  RABBITMQ_DEFAULT_VHOST: plane
  RABBITMQ_VHOST: plane

x-plane-storage-env: &plane-storage-env
  USE_MINIO: 1
  AWS_ACCESS_KEY_ID: ${PLANE_MINIO_ACCESS_KEY:-plane}
  AWS_SECRET_ACCESS_KEY: ${PLANE_MINIO_SECRET_KEY:-change-me-plane-minio}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: uploads
  MINIO_ROOT_USER: ${PLANE_MINIO_ACCESS_KEY:-plane}
  MINIO_ROOT_PASSWORD: ${PLANE_MINIO_SECRET_KEY:-change-me-plane-minio}

x-plane-app-env: &plane-app-env
  WEB_URL: ${PLANE_WEB_URL:-http://localhost:8081}
  CORS_ALLOWED_ORIGINS: ${PLANE_WEB_URL:-http://localhost:8081}
  DATABASE_URL: postgresql://plane:${PLANE_DB_PASSWORD:-change-me-plane-db}@plane-db/plane
  AMQP_URL: amqp://plane:${PLANE_RABBITMQ_PASSWORD:-change-me-plane-rabbitmq}@plane-mq:5672/plane
  SECRET_KEY: ${PLANE_SECRET_KEY:-change-me-plane-secret}
  LIVE_SERVER_SECRET_KEY: ${PLANE_LIVE_SECRET_KEY:-change-me-plane-live-secret}
  API_BASE_URL: http://api:8000
  DEBUG: 0
  GUNICORN_WORKERS: 1
  MINIO_ENDPOINT_SSL: 0

services:
  web:
    image: makeplane/plane-frontend:v1.4.1
    restart: unless-stopped
    depends_on:
      - api
      - worker
    networks:
      - backend

  space:
    image: makeplane/plane-space:v1.4.1
    restart: unless-stopped
    depends_on:
      - api
      - worker
    networks:
      - backend

  admin:
    image: makeplane/plane-admin:v1.4.1
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - backend

  live:
    image: makeplane/plane-live:v1.4.1
    restart: unless-stopped
    environment:
      <<: [*plane-redis-env]
      API_BASE_URL: http://api:8000
      LIVE_SERVER_SECRET_KEY: ${PLANE_LIVE_SECRET_KEY:-change-me-plane-live-secret}
    depends_on:
      - api
    networks:
      - backend

  api:
    image: makeplane/plane-backend:v1.4.1
    command: ./bin/docker-entrypoint-api.sh
    restart: unless-stopped
    environment:
      <<: [*plane-app-env, *plane-db-env, *plane-redis-env, *plane-storage-env]
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
      - plane-minio
    volumes:
      - plane-api-logs:/code/plane/logs
    networks:
      - backend

  worker:
    image: makeplane/plane-backend:v1.4.1
    command: ./bin/docker-entrypoint-worker.sh
    restart: unless-stopped
    environment:
      <<: [*plane-app-env, *plane-db-env, *plane-redis-env, *plane-storage-env]
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
    volumes:
      - plane-worker-logs:/code/plane/logs
    networks:
      - backend

  beat-worker:
    image: makeplane/plane-backend:v1.4.1
    command: ./bin/docker-entrypoint-beat.sh
    restart: unless-stopped
    environment:
      <<: [*plane-app-env, *plane-db-env, *plane-redis-env, *plane-storage-env]
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
    volumes:
      - plane-beat-logs:/code/plane/logs
    networks:
      - backend

  migrator:
    image: makeplane/plane-backend:v1.4.1
    command: ./bin/docker-entrypoint-migrator.sh
    restart: on-failure
    environment:
      <<: [*plane-app-env, *plane-db-env, *plane-redis-env, *plane-storage-env]
    depends_on:
      - plane-db
      - plane-redis
    volumes:
      - plane-migrator-logs:/code/plane/logs
    networks:
      - backend

  plane-db:
    image: postgres:15.7-alpine
    command: postgres -c max_connections=1000
    restart: unless-stopped
    environment:
      <<: *plane-db-env
    volumes:
      - plane-db-data:/var/lib/postgresql/data
    networks:
      - backend

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
      - plane-redis-data:/data
    networks:
      - backend

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      <<: *plane-mq-env
    volumes:
      - plane-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend

  plane-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /export --console-address :9090
    restart: unless-stopped
    environment:
      <<: *plane-storage-env
    volumes:
      - plane-uploads:/export
    networks:
      - backend

  plane-proxy:
    image: makeplane/plane-proxy:v1.4.1
    restart: unless-stopped
    environment:
      APP_DOMAIN: localhost
      LISTEN_HTTP_PORT: 80
      LISTEN_HTTPS_PORT: 443
      SITE_ADDRESS: :80
      BUCKET_NAME: uploads
      FILE_SIZE_LIMIT: 5242880
    depends_on:
      - web
      - api
      - space
      - admin
      - live
    ports:
      - "127.0.0.1:${PLANE_HTTP_PORT:-8081}:80"
    volumes:
      - plane-proxy-config:/config
      - plane-proxy-data:/data
    networks:
      - backend
      - proxy

volumes:
  plane-db-data:
  plane-redis-data:
  plane-rabbitmq-data:
  plane-uploads:
  plane-api-logs:
  plane-worker-logs:
  plane-beat-logs:
  plane-migrator-logs:
  plane-proxy-config:
  plane-proxy-data:
