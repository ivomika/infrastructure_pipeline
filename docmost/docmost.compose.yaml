services:
  docmost:
    image: docmost/docmost:latest
    restart: unless-stopped
    depends_on:
      - docmost-db
      - docmost-redis
    environment:
      APP_URL: ${DOCMOST_APP_URL:-http://localhost:8082}
      APP_SECRET: ${DOCMOST_APP_SECRET:-change-me-docmost-app-secret}
      DATABASE_URL: postgresql://docmost:${DOCMOST_DB_PASSWORD:-change-me-docmost-db}@docmost-db:5432/docmost
      REDIS_URL: redis://docmost-redis:6379
    ports:
      - "127.0.0.1:${DOCMOST_HTTP_PORT:-8082}:3000"
    volumes:
      - docmost-storage:/app/data/storage
    networks:
      - backend
      - proxy

  docmost-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${DOCMOST_DB_PASSWORD:-change-me-docmost-db}
    volumes:
      - docmost-db-data:/var/lib/postgresql
    networks:
      - backend

  docmost-redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - docmost-redis-data:/data
    networks:
      - backend

volumes:
  docmost-storage:
  docmost-db-data:
  docmost-redis-data:
