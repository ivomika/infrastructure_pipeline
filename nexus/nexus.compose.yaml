services:
  nexus:
    image: sonatype/nexus3:3.95.0
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${NEXUS_HTTP_PORT:-8083}:8081"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${NEXUS_DOCKER_PORT:-5000}:5000"
    volumes:
      - nexus-data:/nexus-data
    networks:
      - backend
      - proxy

volumes:
  nexus-data:
