name: Dependency update gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/dependency-update.yml"
      - ".github/workflows/reproducibility.yml"
      - "renovate.json"
      - "jenkins/toolchain.lock"
      - "jenkins/plugins/**"
      - "scripts/refresh-locks.sh"
      - "scripts/security-scan.sh"

permissions:
  contents: read

concurrency:
  group: dependency-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the proposed lock change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          install: true

      - name: Verify registries, artifacts, and official checksums
        run: scripts/verify-locks.sh

  security-and-smoke:
    needs: validate-locks
    runs-on:
      - self-hosted
      - linux
      - x64
      - jenkins-infra
    timeout-minutes: 180
    concurrency:
      group: dependency-update-smoke
      cancel-in-progress: false
    env:
      COMPOSE_PROJECT_NAME: dependency-update-${{ github.run_id }}-${{ github.run_attempt }}
      JENKINS_HOME_VOLUME: dependency-update-${{ github.run_id }}-${{ github.run_attempt }}-jenkins-home
      JENKINS_HOST_ADDRESS: 127.0.0.1
      JENKINS_HTTP_PORT: 18080
      JENKINS_ADMIN_ID: dependency-ci
      JENKINS_ADMIN_PASSWORD: dependency-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SHARED_LIBRARY_NAME: dependency-ci
      SHARED_LIBRARY_REPOSITORY_URL: ssh://git@invalid/dependency-ci.git
      SHARED_LIBRARY_DEFAULT_BRANCH: main
      SHARED_LIBRARY_CREDENTIALS_ID: dependency-ci
    steps:
      - name: Check out the proposed lock change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          install: true

      - name: Prepare isolated runtime inputs
        run: |
          install -m 600 .env.example .env
          rm -f \
            jenkins/secrets/known_hosts \
            jenkins/secrets/shared-library.key \
            jenkins/secrets/shared-library.key.pub
          ssh-keygen -q -t ed25519 -N "" -f jenkins/secrets/shared-library.key
          awk '{ print "invalid " $1 " " $2 }' \
            jenkins/secrets/shared-library.key.pub \
            >jenkins/secrets/known_hosts
          chmod 600 jenkins/secrets/shared-library.key

      - name: Build all locked images
        run: scripts/build-images.sh

      - name: Scan infrastructure configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          # renovate: datasource=github-releases depName=aquasecurity/trivy versioning=semver
          version: v0.70.0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Scan controller, agents, and runtime images
        run: scripts/security-scan.sh

      - name: Start the isolated stack
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          docker compose up --detach --wait --wait-timeout 900

      - name: Provision every ephemeral agent
        run: scripts/smoke-test.sh

      - name: Show logs after a failure
        if: failure()
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          docker compose logs --no-color --tail 200

      - name: Remove the isolated test stack
        if: always()
        run: |
          cleanup_status=0
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          docker compose down --volumes --remove-orphans || cleanup_status=$?
          rm -f \
            .env \
            jenkins/secrets/known_hosts \
            jenkins/secrets/shared-library.key \
            jenkins/secrets/shared-library.key.pub
          exit "$cleanup_status"
