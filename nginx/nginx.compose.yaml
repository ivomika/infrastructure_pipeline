services:
  nginx:
    image: nginx:1.28.3-alpine
    restart: unless-stopped
    depends_on:
      - jenkins-controller
      - plane-proxy
      - docmost
      - nexus
      - grafana
    environment:
      JENKINS_HOST: ${JENKINS_HOST:-jenkins.localhost}
      PLANE_HOST: ${PLANE_HOST:-plane.localhost}
      DOCMOST_HOST: ${DOCMOST_HOST:-docs.localhost}
      NEXUS_HOST: ${NEXUS_HOST:-nexus.localhost}
      NEXUS_DOCKER_HOST: ${NEXUS_DOCKER_HOST:-registry.localhost}
      GRAFANA_HOST: ${GRAFANA_HOST:-grafana.localhost}
      TLS_CERT_NAME: ${TLS_CERT_NAME:-devops-infra}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./templates/${NGINX_TEMPLATE_FILE:-default.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ./snippets:/etc/nginx/snippets:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    command:
      - /bin/sh
      - -c
      - |
        while sleep 60; do
          if [ -f /var/www/certbot/.reload-nginx ]; then
            nginx -s reload && rm -f /var/www/certbot/.reload-nginx
          fi
        done &
        exec nginx -g 'daemon off;'
    networks:
      - proxy

  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:latest}
    profiles:
      - certbot
    environment: &certbot-environment
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      TLS_CERT_NAME: ${TLS_CERT_NAME:-devops-infra}
      JENKINS_HOST: ${JENKINS_HOST:-jenkins.localhost}
      PLANE_HOST: ${PLANE_HOST:-plane.localhost}
      DOCMOST_HOST: ${DOCMOST_HOST:-docs.localhost}
      NEXUS_HOST: ${NEXUS_HOST:-nexus.localhost}
      NEXUS_DOCKER_HOST: ${NEXUS_DOCKER_HOST:-registry.localhost}
      GRAFANA_HOST: ${GRAFANA_HOST:-grafana.localhost}
    entrypoint:
      - /bin/sh
      - /opt/certbot/issue.sh
    volumes: &certbot-volumes
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - certbot-metrics:/var/lib/node_exporter/textfile_collector
      - ./certbot:/opt/certbot:ro
    networks:
      - proxy

  certbot-renew:
    image: ${CERTBOT_IMAGE:-certbot/certbot:latest}
    profiles:
      - production
    restart: unless-stopped
    environment:
      <<: *certbot-environment
      CERTBOT_RENEW_INTERVAL: ${CERTBOT_RENEW_INTERVAL:-43200}
    entrypoint:
      - /bin/sh
      - /opt/certbot/renew.sh
    volumes: *certbot-volumes
    networks:
      - proxy

volumes:
  certbot-certs:
  certbot-webroot:
  certbot-metrics:
